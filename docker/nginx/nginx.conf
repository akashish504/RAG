worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50m;

    # Rate-limit zone for MCP paths: 10 requests/second per client IP.
    # Burst of 20 allows short bursts (e.g. handshake + tools/list + tools/call)
    # without immediately returning 429. Requests beyond the burst are delayed
    # then rejected — `nodelay` makes burst slots instant rather than queued.
    limit_req_zone $binary_remote_addr zone=mcp_ratelimit:10m rate=10r/s;

    upstream pipeline_api {
        server 127.0.0.1:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # MCP endpoints: extended timeouts (tool calls invoke OpenSearch +
        # optional Claude planning) and streaming-friendly buffering.
        location /mcp {
            limit_req zone=mcp_ratelimit burst=20 nodelay;
            limit_req_status 429;

            proxy_http_version 1.1;
            proxy_set_header Connection "";
            # FastMCP validates the Host header against an allowlist that
            # defaults to localhost. Rewrite to localhost so the check passes;
            # the real external hostname is preserved in X-Forwarded-Host.
            proxy_set_header Host "localhost";
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Streamable HTTP: never buffer the response body to disk.
            proxy_buffering off;
            proxy_cache off;

            # Allow up to 120 s for a tool call to complete.
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;

            proxy_pass http://pipeline_api;
        }

        # All other routes (health, /v1/*, etc.) use standard settings.
        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://pipeline_api;
        }
    }
}
