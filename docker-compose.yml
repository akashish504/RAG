name: dalberg-mcp

x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
  image: dalberg-mcp:local
  env_file:
    - .env
  environment:
    AWS_REGION: ${AWS_REGION:-eu-west-1}
  working_dir: /app
  volumes:
    - .:/app

services:
  # FastAPI + Nginx (public :80 on host -> Nginx :80 -> Uvicorn :8000).
  # On EC2: docker compose up -d / docker compose down (no --profile needed).
  # API_BEARER_TOKEN must be set in .env.
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: dalberg-mcp-api:local
    restart: unless-stopped
    ports:
      - "${API_HOST_PORT:-80}:80"
    environment:
      API_BEARER_TOKEN: ${API_BEARER_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-eu-west-1}
      # /app/config is mounted read-only; schema snapshot writes can only fail.
      AIRTABLE_SCHEMA_AUTO_SAVE: "0"
    env_file:
      - .env
    # Mount config read-only so schema snapshots (config/*_schema.json) are read
    # live from the host — regenerate a snapshot then `docker compose restart api`,
    # no image rebuild needed.
    volumes:
      - ./config:/app/config:ro

  # General-purpose pipeline container. Use command overrides for new scripts:
  # docker compose run --rm pipeline python scripts/read_s3_text.py ...
  pipeline:
    <<: *app-base
    command: python scripts/run_pipeline.py --help

  # Long-running SQS consumer for the event-driven Airtable ingestion pipeline
  # (every target with poll_enabled in config/airtable_ingestion.yaml).
  # The poller (scripts/run_poller.py) that feeds this queue is cron-driven,
  # not a compose service — it's a one-shot `docker compose run --rm pipeline
  # python scripts/run_poller.py` on a host crontab entry (weekly, Sat 09:00
  # server time, registered by scripts/reset_deployment.sh).
  worker:
    <<: *app-base
    command: python scripts/run_worker.py
    restart: unless-stopped

  # Convenience service for the current S3 reader smoke test.
  s3-smoke:
    <<: *app-base
    profiles: ["tools"]
    command: >
      python scripts/read_s3_text.py
      --bucket ${S3_BUCKET:-claude-mcp-object-store}
      --key ${S3_TEST_KEY:-sample.txt}
      --region ${AWS_REGION:-eu-west-1}

  test:
    <<: *app-base
    profiles: ["tools"]
    command: pytest

  lint:
    <<: *app-base
    profiles: ["tools"]
    command: sh -c "ruff check src tests scripts && mypy src"

  shell:
    <<: *app-base
    profiles: ["tools"]
    command: bash
    stdin_open: true
    tty: true
